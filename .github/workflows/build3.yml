name: Build APK

on:
  push:
    branches: [ dev-d1 ]
  pull_request:
    branches: [ dev-d1 ]
  workflow_dispatch:

permissions:
  contents: write

# Prevent two runs on the same branch from racing for the same auto-tag
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      DROPBOX_API_KEY: ${{ secrets.DROPBOX_API_KEY }}
      PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
      ONEDRIVE_API_REDIRCT_URI: ${{ secrets.ONEDRIVE_API_REDIRCT_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > presentation/my-release-key.keystore

      - name: Verify keystore credentials
        run: |
          if keytool -list -keystore presentation/my-release-key.keystore \
               -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
               -alias "${{ secrets.KEY_ALIAS }}" > /dev/null 2>&1; then
            echo "✓ Keystore and alias verified"
          else
            echo "::error::Keystore verification failed — check KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS secrets"
            exit 1
          fi

      - name: Build release variants
        run: ./gradlew assembleRelease --warning-mode all

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: presentation/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Build debug variants
        run: ./gradlew assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: presentation/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Get next version
        id: get_version
        run: |
          tags=$(git tag -l 'v*' | sort -V)
          if [ -z "$tags" ]; then
            echo "next_version=1.0.0" >> $GITHUB_OUTPUT
          else
            latest_tag=$(echo "$tags" | tail -n 1)
            version=${latest_tag#v}
            IFS='.' read -r major minor patch <<< "$version"
            new_version="${major}.${minor}.$((patch + 1))"
            echo "next_version=${new_version}" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: github.ref == 'refs/heads/dev-d1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git tag -a "v${{ steps.get_version.outputs.next_version }}" -m "Auto release v${{ steps.get_version.outputs.next_version }}"
          git push origin "v${{ steps.get_version.outputs.next_version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/dev-d1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          files: |
            presentation/build/outputs/apk/*/release/*.apk
            presentation/build/outputs/apk/*/debug/*.apk
          tag_name: v${{ steps.get_version.outputs.next_version }}
          name: Release v${{ steps.get_version.outputs.next_version }}
          body: |
            Build from branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
