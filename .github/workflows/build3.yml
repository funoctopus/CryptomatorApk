name: Build APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle3
        run: ./gradlew assembleRelease     

      - name: List build outputs3
        run: |
          echo "Listing build outputs directory:"
          ls -R presentation/build/outputs/apk/

      - name: Upload APK
        id: upload-apk3
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: presentation/build/outputs/apk/playstore/release/presentation-release.apk

      - name: Upload APK
        id: upload-apk4
