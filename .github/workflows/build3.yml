          name: app-release
          path: presentation/build/outputs/apk/playstore/release/presentation-playstore-release-unsigned.apk          

      - name: Build with Gradle
        run: ./gradlew assemblePlaystoreDebug

      - name: List build outputs
        run: |
          echo "Listing build outputs directory:"
          ls -R presentation/build/outputs/apk/

      - name: Upload APK
        id: upload-apk1
        uses: actions/upload-artifact@v4
        with:
          name: app-playstore-debug
          path: presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk

        

      - name: Build with Gradle2
        run: ./gradlew assemblePlaystoreRelease

      - name: List build outputs2
        run: |
          echo "Listing build outputs directory:"
          ls -R presentation/build/outputs/apk/

      - name: Upload APK
        id: upload-apk2
        uses: actions/upload-artifact@v4
        with:
          name: app-playstore-release
          path: presentation/build/outputs/apk/playstore/release/presentation-playstore-release-unsigned.apk





      - name: Get next version
        id: get_version
        run: |
          # Get all tags and sort them
          tags=$(git tag -l 'v*' | sort -V)
          if [ -z "$tags" ]; then
            # If no tags exist, start with 1.0.0
            echo "next_version=1.0.0" >> $GITHUB_OUTPUT
          else
            # Get the latest tag
            latest_tag=$(echo "$tags" | tail -n 1)
            # Remove 'v' prefix
            version=${latest_tag#v}
            # Split version into components
            IFS='.' read -r major minor patch <<< "$version"
            # Increment patch version
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}"
            echo "next_version=${new_version}" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git tag -a "v${{ steps.get_version.outputs.next_version }}" -m "Auto release v${{ steps.get_version.outputs.next_version }}"
          git push origin "v${{ steps.get_version.outputs.next_version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        with:
          files: presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk
          tag_name: v${{ steps.get_version.outputs.next_version }}
          name: Release v${{ steps.get_version.outputs.next_version }}
          body: |
            Build from branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
